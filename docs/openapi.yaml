components:
  securitySchemes:
    x402PaymentSignature:
      type: apiKey
      in: header
      name: payment-signature
      description: 'Production Mercury expects an x402 payment payload in the `payment-signature` header.


        **Format:** `payment-signature: <base64_x402_payment_payload>`


        **How to pay:**

        1. Call any paid endpoint without payment headers

        2. Read the `Payment-Required` header (base64url x402 descriptor)

        3. Use an x402-compatible client or payment processor to create a signed payment payload

        4. Retry the request with `payment-signature`


        **Legacy bearer compatibility:**

        Unsigned `Authorization: Bearer x402_<token>` flow is disabled in production unless `ALLOW_LEGACY_BEARER=true`.

        '
  schemas:
    FREDResponse:
      type: object
      required:
      - data
      - provenance
      properties:
        data:
          type: object
          required:
          - series_id
          - observations
          properties:
            series_id:
              type: string
              example: UNRATE
            title:
              type: string
              example: Unemployment Rate
            units:
              type: string
              example: Percent
            frequency:
              type: string
              example: Monthly
            seasonal_adjustment:
              type: string
              example: Seasonally Adjusted
            last_updated:
              type: string
              format: date-time
            observation_count:
              type: integer
              example: 1
            observations:
              type: array
              items:
                type: object
                required:
                - date
                - value
                properties:
                  date:
                    type: string
                    format: date
                  value:
                    oneOf:
                    - type: string
                    - type: 'null'
                    description: FRED returns "." for missing values (converted to null)
                    example: '4.0'
        provenance:
          $ref: '#/components/schemas/Provenance'
    Indicator:
      type: object
      required:
      - value
      - date
      - unit
      properties:
        value:
          type: number
          example: 4.3
        date:
          type: string
          format: date
          example: '2026-01-01'
        unit:
          type: string
          example: Percent
    TreasuryResponseV1:
      type: object
      required:
      - data
      - provenance
      properties:
        data:
          type: object
          required:
          - record_date
          - rates
          properties:
            record_date:
              type: string
              format: date
            rates:
              type: object
              properties:
                1_MONTH:
                  type: number
                  format: float
                3_MONTH:
                  type: number
                6_MONTH:
                  type: number
                1_YEAR:
                  type: number
                2_YEAR:
                  type: number
                3_YEAR:
                  type: number
                5_YEAR:
                  type: number
                7_YEAR:
                  type: number
                10_YEAR:
                  type: number
                20_YEAR:
                  type: number
                30_YEAR:
                  type: number
              additionalProperties: false
        provenance:
          allOf:
          - $ref: '#/components/schemas/Provenance'
          - type: object
            properties:
              series_coverage:
                type: string
                example: 11/11 maturities
              cache_until:
                type: string
                format: date-time
    TreasuryResponseV0_9:
      type: object
      required:
      - record_date
      - rates
      properties:
        record_date:
          type: string
          format: date
        rates:
          type: object
          additionalProperties:
            type: number
    CompositeResponse:
      type: object
      required:
      - data
      - provenance
      properties:
        data:
          type: object
          required:
          - dashboard
          - timestamp
          - indicators
          properties:
            dashboard:
              type: string
              enum:
              - economic-overview
              - inflation-tracker
              - labor-market
            timestamp:
              type: string
              format: date-time
            indicators:
              type: array
              items:
                type: object
                required:
                - series_id
                - value
                - date
                properties:
                  series_id:
                    type: string
                  title:
                    type: string
                  value:
                    oneOf:
                    - type: string
                    - type: 'null'
                  date:
                    type: string
                    format: date
                  units:
                    type: string
        provenance:
          $ref: '#/components/schemas/Provenance'
    Provenance:
      type: object
      required:
      - source
      - source_url
      - fetched_at
      - mercury_version
      - deterministic
      properties:
        source:
          type: string
          example: Federal Reserve Economic Data (FRED)
        source_url:
          type: string
          format: uri
        fetched_at:
          type: string
          format: date-time
        mercury_version:
          type: string
          example: v1.0
        deterministic:
          type: boolean
          description: Whether this response is deterministic/reproducible
        signature:
          type: string
          nullable: true
          description: ECDSA signature of canonical data (hex, with 0x prefix). Optional - only present
            if signing wallet is configured.
          pattern: ^0x[a-fA-F0-9]+$
        requested_date:
          type: string
          format: date
          description: Present if date query param was used
        observation_start:
          type: string
          format: date
          description: Present if observation_start query param was used
        observation_end:
          type: string
          format: date
          description: Present if observation_end query param was used
    X402Discovery:
      type: object
      required:
      - x402Version
      - accepts
      properties:
        x402Version:
          type: integer
          example: 2
        accepts:
          type: array
          items:
            type: object
            required:
            - scheme
            - network
            - amount
            - payTo
            - maxTimeoutSeconds
            - asset
            properties:
              scheme:
                type: string
                enum:
                - exact
              network:
                type: string
                example: eip155:8453
                description: Base mainnet
              amount:
                type: string
                example: '150000'
                description: Amount in wei (USDC has 6 decimals)
              payTo:
                type: string
                example: '0xF8d59270cBC746a7593D25b6569812eF1681C6D2'
                description: Merchant wallet address
              maxTimeoutSeconds:
                type: integer
                example: 30
              asset:
                type: string
                example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                description: USDC contract address on Base
              extra:
                type: object
                properties:
                  endpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        price:
                          type: number
                        description:
                          type: string
        extensions:
          type: object
          description: Optional x402 protocol extensions
    PaymentRequired:
      type: object
      required:
      - x402Version
      - error
      - accepts
      properties:
        x402Version:
          type: integer
          example: 1
        error:
          type: string
          enum:
          - payment required
        accepts:
          type: array
          items:
            type: object
            properties:
              scheme:
                type: string
                example: exact
              network:
                type: string
                example: base
              maxAmountRequired:
                type: string
                example: '50000'
              payTo:
                type: string
                example: '0xF8d59270cBC746a7593D25b6569812eF1681C6D2'
              asset:
                type: string
                example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
              maxTimeoutSeconds:
                type: integer
                example: 30
        status:
          type: string
          description: Additional status info (present for PAYMENT_VERIFICATION_UNAVAILABLE)
  responses:
    PaymentRequired:
      description: Payment required via x402
      headers:
        Payment-Required:
          schema:
            type: string
          description: Base64url-encoded x402 payment descriptor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRequired'
          example:
            x402Version: 1
            error: payment required
            accepts:
            - scheme: exact
              network: base
              maxAmountRequired: '50000'
              payTo: '0xF8d59270cBC746a7593D25b6569812eF1681C6D2'
              asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
              maxTimeoutSeconds: 30
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_ERROR
                  message:
                    type: string
    ServiceUnavailable:
      description: Service configuration issue (e.g., missing API key)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: SERVICE_UNAVAILABLE
                  message:
                    type: string
                    example: FRED API key not configured
