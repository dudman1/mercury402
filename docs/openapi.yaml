openapi: 3.0.3
info:
  title: Mercury x402 API
  version: 1.3.0
  description: 'Deterministic financial data with cryptographic provenance.


    Payment required via x402 protocol (HTTP 402 + USDC on Base).

    All paid endpoints require the `payment-signature` header in production.


    **Payment Flow:**

    1. Call endpoint without auth → receive 402 with Payment-Required header

    2. Pay via x402 protocol (USDC on Base mainnet)

    3. Retry with `payment-signature` → receive 200 + data


    **Data Sources:**

    - FRED (Federal Reserve Economic Data): 800k+ economic series

    - U.S. Treasury rates: 11 maturities via FRED DGS series


    **Catalog:** 78 priced routes advertised via `/.well-known/x402` (aliases + composites + AI).

    '
  contact:
    name: Mercury x402 Support
    url: https://api.mercury402.com
    email: support@mercury402.com
  license:
    name: Proprietary
  guidance: Mercury402 provides deterministic financial data (FRED, Treasury rates, macro indicators)
    via x402 micropayments on Base. Call any endpoint, receive 402, pay via an x402-compatible client,
    then retry with the payment-signature header.
x-discovery:
  ownershipProofs: []
servers:
- url: https://api.mercury402.com
  description: Production
- url: http://localhost:4020
  description: Local development
security:
- x402PaymentSignature: []
tags:
- name: FRED
  description: Federal Reserve Economic Data series
- name: Treasury
  description: U.S. Treasury yield curve data
- name: Composite
  description: Multi-series composite dashboards
- name: Discovery
  description: Service discovery and health
- name: Documentation
  description: Documentation and examples
- name: Macro
  description: Macro snapshots and bundles
- name: Forex
  description: FX cross-rates via FRED DEX series
- name: Yield Spreads
  description: Computed Treasury yield curve spreads
- name: Breakeven
  description: TIPS breakeven inflation
- name: AI
  description: AI briefing and Q&A over macro context
paths:
  /v1/ai/ask:
    post:
      summary: 'Ask the Data: natural-language question answered ONLY from chosen Mercury402 FRED series
        (grounded, cited)'
      description: 'Ask the Data: natural-language question answered ONLY from chosen Mercury402 FRED
        series (grounded, cited).


        **Pricing:** $0.15 USDC per call (x402 on Base).


        Call without payment to receive HTTP 402 + Payment-Required, then retry with `payment-signature`.'
      operationId: v1_ai_ask
      x-payment-info:
        price:
          currency: USD
          amount: '0.15'
        protocols:
        - x402: {}
      tags:
      - AI
      responses:
        '200':
          description: Paid success — JSON payload with data and provenance
          content:
            application/json:
              schema:
                type: object
        '402':
          description: Payment Required — x402 challenge
      security:
      - x402PaymentSignature: []
