  /v1/fred/{series_id}:
    get:
      summary: Fetch FRED economic series data
      description: 'Returns observations for any FRED series ID (GDP, UNRATE, DGS10, etc.).


        **Pricing:**

        - Single date or latest: $0.05

        - Date range (observation_start + observation_end): $0.10


        **Common Series:**

        - UNRATE: Unemployment Rate

        - GDP: Gross Domestic Product

        - CPIAUCSL: Consumer Price Index

        - DGS10: 10-Year Treasury Rate

        - FEDFUNDS: Federal Funds Rate


        Browse all series: https://fred.stlouisfed.org/

        '
      operationId: getFredSeries
      x-payment-info:
        price:
          currency: USD
          mode: dynamic
          min: '0.05'
          max: '0.10'
        protocols:
        - x402: {}
      tags:
      - FRED
      security:
      - x402PaymentSignature: []
      parameters:
      - name: series_id
        in: path
        required: true
        example: UNRATE
        schema:
          type: string
          example: UNRATE
        description: FRED series ID (case-sensitive)
      - name: date
        in: query
        schema:
          type: string
          format: date
          example: '2026-01-01'
        description: Single date observation (YYYY-MM-DD)
      - name: observation_start
        in: query
        schema:
          type: string
          format: date
          example: '2020-01-01'
        description: Start date for range query (requires observation_end)
      - name: observation_end
        in: query
        schema:
          type: string
          format: date
          example: '2023-12-31'
        description: End date for range query (requires observation_start)
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          example: 5
        description: Max observations to return (ignored if date/range specified)
      responses:
        '200':
          description: Successful response with data and provenance
          headers:
            X-Mercury-Price:
              schema:
                type: string
                example: $0.01
              description: Price charged for this call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FREDResponse'
              example:
                data:
                  series_id: UNRATE
                  title: Unemployment Rate
                  units: Percent
                  frequency: Monthly
                  seasonal_adjustment: Seasonally Adjusted
                  last_updated: '2026-02-07T13:03:22.000Z'
                  observation_count: 1
                  observations:
                  - date: '2026-01-01'
                    value: '4.0'
                provenance:
                  source: Federal Reserve Economic Data (FRED)
                  source_url: https://fred.stlouisfed.org/series/UNRATE
                  fetched_at: '2026-03-04T18:20:00.000Z'
                  mercury_version: v1.0
                  deterministic: true
                  signature: 0x42d8f3f315633eaab09da600a89463314a1344da...
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          description: Series not found or no data available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - SERIES_NOT_FOUND
                        - NO_DATA_FOUND
                      message:
                        type: string
                      series_id:
                        type: string
              example:
                error:
                  code: SERIES_NOT_FOUND
                  message: Series 'INVALID' not found in FRED database
                  series_id: INVALID
        '429':
          description: FRED API rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: RATE_LIMIT_EXCEEDED
                      message:
                        type: string
                      retry_after:
                        type: integer
                        example: 60
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
